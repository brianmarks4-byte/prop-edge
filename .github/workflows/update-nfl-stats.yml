name: Update NFL Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download 2025 NFL player stats
        run: |
          curl -L --fail \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv" \
            -o /tmp/stats_2025.csv

          mv /tmp/stats_2025.csv data/stats_player_week_2025.csv

      - name: Download 2026 NFL player stats
        run: |
          if curl -L --fail \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv" \
            -o /tmp/stats_2026.csv
          then
            mv /tmp/stats_2026.csv data/stats_player_week_2026.csv
          else
            echo "2026 stats not available yet."
            rm -f /tmp/stats_2026.csv
          fi

      - name: Download 2026 NFL injury reports
        run: |
          if curl -L --fail \
            "https://github.com/nflverse/nflverse-data/releases/download/injuries/injuries_2026.csv" \
            -o /tmp/injuries_2026.csv
          then
            mv /tmp/injuries_2026.csv data/injuries_2026.csv
          else
            echo "2026 injury data not available right now."
            rm -f /tmp/injuries_2026.csv
          fi

      - name: Build Prop Edge v6 data
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import defaultdict

          # ---------------------------------
          # SOURCE FILES
          # ---------------------------------

          source_files = [
              "data/stats_player_week_2025.csv",
              "data/stats_player_week_2026.csv",
          ]

          injury_source = "data/injuries_2026.csv"

          # ---------------------------------
          # PLAYER MODEL FILE
          # ---------------------------------

          player_columns = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "position_group",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "completions",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds",
          ]

          player_output = "data/prop_edge_stats.csv"

          # ---------------------------------
          # MATCHUP MODEL FILE
          # ---------------------------------

          matchup_columns = [
              "season",
              "week",
              "defense",
              "offense",
              "position_group",
              "pass_attempts_allowed",
              "completions_allowed",
              "passing_yards_allowed",
              "passing_tds_allowed",
              "interceptions_forced",
              "rush_attempts_allowed",
              "rushing_yards_allowed",
              "rushing_tds_allowed",
              "targets_allowed",
              "receptions_allowed",
              "receiving_yards_allowed",
              "receiving_tds_allowed",
          ]

          matchup_output = "data/prop_edge_matchups.csv"

          # ---------------------------------
          # INJURY MODEL FILE
          # ---------------------------------

          injury_output = "data/prop_edge_injuries.csv"

          # These are the fields Prop Edge v6
          # will read if they exist in nflverse.
          injury_output_columns = [
              "season",
              "week",
              "team",
              "player_name",
              "position",
              "report_primary_injury",
              "report_secondary_injury",
              "report_status",
              "practice_status",
              "date_modified",
          ]

          # ---------------------------------
          # HELPERS
          # ---------------------------------

          def number(value):
              try:
                  if value is None or value == "":
                      return 0.0
                  return float(value)
              except:
                  return 0.0

          def clean_position_group(row):
              group = (row.get("position_group") or "").strip().upper()

              if group:
                  return group

              position = (row.get("position") or "").strip().upper()

              if position == "QB":
                  return "QB"

              if position in ("RB", "FB"):
                  return "RB"

              if position == "WR":
                  return "WR"

              if position == "TE":
                  return "TE"

              return "OTHER"

          def first_value(row, names):
              for name in names:
                  value = row.get(name)

                  if value is not None:
                      value = str(value).strip()

                      if value:
                          return value

              return ""

          # ---------------------------------
          # READ PLAYER DATA
          # ---------------------------------

          all_rows = []

          for source in source_files:

              if not os.path.exists(source):
                  continue

              with open(
                  source,
                  newline="",
                  encoding="utf-8-sig"
              ) as f:

                  reader = csv.DictReader(f)

                  for row in reader:

                      season_type = (
                          row.get("season_type") or ""
                      ).strip().upper()

                      # Regular season only.
                      if season_type and season_type != "REG":
                          continue

                      all_rows.append(row)

          print(
              f"Loaded {len(all_rows)} "
              "regular-season player rows"
          )

          # ---------------------------------
          # WRITE COMPACT PLAYER FILE
          # ---------------------------------

          player_rows_written = 0

          with open(
              player_output,
              "w",
              newline="",
              encoding="utf-8"
          ) as out:

              writer = csv.DictWriter(
                  out,
                  fieldnames=player_columns
              )

              writer.writeheader()

              for row in all_rows:

                  writer.writerow({
                      col: row.get(col, "")
                      for col in player_columns
                  })

                  player_rows_written += 1

          print(
              f"Wrote {player_rows_written} rows "
              f"to {player_output}"
          )

          # ---------------------------------
          # BUILD DEFENSE / MATCHUP DATA
          # ---------------------------------

          matchup = defaultdict(lambda: {
              "pass_attempts_allowed": 0.0,
              "completions_allowed": 0.0,
              "passing_yards_allowed": 0.0,
              "passing_tds_allowed": 0.0,
              "interceptions_forced": 0.0,
              "rush_attempts_allowed": 0.0,
              "rushing_yards_allowed": 0.0,
              "rushing_tds_allowed": 0.0,
              "targets_allowed": 0.0,
              "receptions_allowed": 0.0,
              "receiving_yards_allowed": 0.0,
              "receiving_tds_allowed": 0.0,
          })

          metric_map = {
              "attempts": "pass_attempts_allowed",
              "completions": "completions_allowed",
              "passing_yards": "passing_yards_allowed",
              "passing_tds": "passing_tds_allowed",
              "interceptions": "interceptions_forced",
              "carries": "rush_attempts_allowed",
              "rushing_yards": "rushing_yards_allowed",
              "rushing_tds": "rushing_tds_allowed",
              "targets": "targets_allowed",
              "receptions": "receptions_allowed",
              "receiving_yards": "receiving_yards_allowed",
              "receiving_tds": "receiving_tds_allowed",
          }

          for row in all_rows:

              season = str(
                  row.get("season") or ""
              ).strip()

              week = str(
                  row.get("week") or ""
              ).strip()

              offense = (
                  row.get("team") or ""
              ).strip().upper()

              defense = (
                  row.get("opponent_team") or ""
              ).strip().upper()

              if not season or not week:
                  continue

              if not offense or not defense:
                  continue

              position_group = clean_position_group(row)

              keys = [
                  (
                      season,
                      week,
                      defense,
                      offense,
                      position_group
                  ),
                  (
                      season,
                      week,
                      defense,
                      offense,
                      "ALL"
                  ),
              ]

              for key in keys:

                  bucket = matchup[key]

                  for source_col, output_col in metric_map.items():

                      bucket[output_col] += number(
                          row.get(source_col)
                      )

          # ---------------------------------
          # WRITE MATCHUP FILE
          # ---------------------------------

          matchup_rows = []

          for key, totals in matchup.items():

              (
                  season,
                  week,
                  defense,
                  offense,
                  position_group
              ) = key

              row = {
                  "season": season,
                  "week": week,
                  "defense": defense,
                  "offense": offense,
                  "position_group": position_group,
              }

              for metric in matchup_columns[5:]:

                  value = totals[metric]

                  if abs(
                      value - round(value)
                  ) < 0.000001:

                      value = int(round(value))

                  else:
                      value = round(value, 3)

                  row[metric] = value

              matchup_rows.append(row)

          matchup_rows.sort(
              key=lambda r: (
                  int(r["season"]),
                  int(r["week"]),
                  r["defense"],
                  r["position_group"]
              )
          )

          with open(
              matchup_output,
              "w",
              newline="",
              encoding="utf-8"
          ) as out:

              writer = csv.DictWriter(
                  out,
                  fieldnames=matchup_columns
              )

              writer.writeheader()

              writer.writerows(matchup_rows)

          print(
              f"Wrote {len(matchup_rows)} matchup rows "
              f"to {matchup_output}"
          )

          # ---------------------------------
          # BUILD INJURY FILE
          # ---------------------------------

          injury_rows = []

          if os.path.exists(injury_source):

              with open(
                  injury_source,
                  newline="",
                  encoding="utf-8-sig"
              ) as f:

                  reader = csv.DictReader(f)

                  source_columns = reader.fieldnames or []

                  print(
                      "Injury source columns: "
                      + ", ".join(source_columns)
                  )

                  for row in reader:

                      season = first_value(
                          row,
                          [
                              "season",
                          ]
                      )

                      week = first_value(
                          row,
                          [
                              "week",
                          ]
                      )

                      team = first_value(
                          row,
                          [
                              "team",
                              "team_abbr",
                              "club",
                          ]
                      ).upper()

                      player_name = first_value(
                          row,
                          [
                              "full_name",
                              "player_name",
                              "player",
                              "name",
                          ]
                      )

                      position = first_value(
                          row,
                          [
                              "position",
                              "pos",
                          ]
                      ).upper()

                      primary_injury = first_value(
                          row,
                          [
                              "report_primary_injury",
                              "primary_injury",
                              "injury",
                          ]
                      )

                      secondary_injury = first_value(
                          row,
                          [
                              "report_secondary_injury",
                              "secondary_injury",
                          ]
                      )

                      report_status = first_value(
                          row,
                          [
                              "report_status",
                              "game_status",
                              "status",
                          ]
                      )

                      practice_status = first_value(
                          row,
                          [
                              "practice_status",
                              "practice_participation",
                              "practice",
                          ]
                      )

                      date_modified = first_value(
                          row,
                          [
                              "date_modified",
                              "last_modified",
                              "updated_at",
                              "date",
                          ]
                      )

                      # We need a player name to match
                      # the record to PrizePicks.
                      if not player_name:
                          continue

                      injury_rows.append({
                          "season": season,
                          "week": week,
                          "team": team,
                          "player_name": player_name,
                          "position": position,
                          "report_primary_injury": primary_injury,
                          "report_secondary_injury": secondary_injury,
                          "report_status": report_status,
                          "practice_status": practice_status,
                          "date_modified": date_modified,
                      })

          # Newest / highest week first.
          def injury_sort_key(row):

              try:
                  season = int(
                      row.get("season") or 0
                  )
              except:
                  season = 0

              try:
                  week = int(
                      row.get("week") or 0
                  )
              except:
                  week = 0

              return (
                  -season,
                  -week,
                  row.get("team", ""),
                  row.get("player_name", "")
              )

          injury_rows.sort(
              key=injury_sort_key
          )

          with open(
              injury_output,
              "w",
              newline="",
              encoding="utf-8"
          ) as out:

              writer = csv.DictWriter(
                  out,
                  fieldnames=injury_output_columns
              )

              writer.writeheader()

              writer.writerows(injury_rows)

          print(
              f"Wrote {len(injury_rows)} injury rows "
              f"to {injury_output}"
          )

          # ---------------------------------
          # QUICK VALIDATION
          # ---------------------------------

          defenses = {
              row["defense"]
              for row in matchup_rows
              if row["defense"]
          }

          seasons = {
              row["season"]
              for row in matchup_rows
              if row["season"]
          }

          print(
              "Matchup database contains "
              f"{len(defenses)} defenses "
              f"across seasons: "
              f"{', '.join(sorted(seasons))}"
          )

          if not matchup_rows:
              raise RuntimeError(
                  "No matchup rows were generated."
              )

          if os.path.exists(injury_source):

              if not injury_rows:
                  print(
                      "WARNING: Injury source downloaded "
                      "but no usable player rows were found."
                  )

              else:
                  print(
                      "Injury database successfully built."
                  )

          else:
              print(
                  "Injury source unavailable. "
                  "Player and matchup data still completed."
              )

          PY

      - name: Commit updated stats
        run: |
          git config user.name "Prop Edge Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "Update Prop Edge NFL data"
            git push
          fi
