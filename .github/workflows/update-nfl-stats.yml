name: Update NFL Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download 2025 NFL player stats
        run: |
          curl -L --fail \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2025.csv" \
            -o /tmp/stats_2025.csv

          mv /tmp/stats_2025.csv data/stats_player_week_2025.csv

      - name: Download 2026 NFL player stats
        run: |
          if curl -L --fail \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv" \
            -o /tmp/stats_2026.csv
          then
            mv /tmp/stats_2026.csv data/stats_player_week_2026.csv
          else
            echo "2026 stats not available yet."
            rm -f /tmp/stats_2026.csv
          fi

      - name: Build compact Prop Edge stats
        run: |
          python - <<'PY'
          import csv
          import os

          wanted = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "completions",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds",
          ]

          source_files = [
              "data/stats_player_week_2025.csv",
              "data/stats_player_week_2026.csv",
          ]

          output = "data/prop_edge_stats.csv"

          rows_written = 0

          with open(output, "w", newline="", encoding="utf-8") as out:
              writer = csv.DictWriter(out, fieldnames=wanted)
              writer.writeheader()

              for source in source_files:
                  if not os.path.exists(source):
                      continue

                  with open(source, newline="", encoding="utf-8-sig") as f:
                      reader = csv.DictReader(f)

                      for row in reader:
                          writer.writerow({
                              col: row.get(col, "")
                              for col in wanted
                          })
                          rows_written += 1

          print(f"Wrote {rows_written} rows to {output}")
          PY

      - name: Commit updated stats
        run: |
          git config user.name "Prop Edge Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No stats changes."
          else
            git commit -m "Update NFL player stats"
            git push
          fi
